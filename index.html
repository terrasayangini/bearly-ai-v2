<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🧸 Bearly AI Assistant</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#edf2f7;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.chat-box{

    width:390px;
    height:650px;

    background:white;

    border-radius:20px;

    overflow:hidden;

    display:flex;

    flex-direction:column;

    box-shadow:0 12px 35px rgba(0,0,0,.15);

}

.header{

    background:#0d6efd;

    color:white;

    text-align:center;

    padding:18px;

}

.header h2{

    font-size:22px;

}

.header p{

    margin-top:5px;

    font-size:13px;

    opacity:.9;

}

.messages{

    flex:1;

    overflow-y:auto;

    padding:16px;

    background:#f7f8fb;

}

.message{

    max-width:82%;

    padding:12px 15px;

    margin:10px 0;

    border-radius:15px;

    line-height:1.5;

    word-break:break-word;

}

.user{

    margin-left:auto;

    background:#0d6efd;

    color:white;

}

.bot{

    background:#e9ecef;

    color:#222;

}

.footer{

    display:flex;

    border-top:1px solid #ddd;

}

.footer input{

    flex:1;

    border:none;

    outline:none;

    padding:15px;

    font-size:15px;

}

.footer button{

    width:90px;

    border:none;

    background:#0d6efd;

    color:white;

    cursor:pointer;

    transition:.2s;

}

.footer button:hover{

    background:#0b5ed7;

}

.typing{

    color:#666;

    font-style:italic;

}

</style>

</head>

<body>

<div class="chat-box">

<div class="header">

<h2>🧸 Bearly AI</h2>

<p>Your Friendly AI Assistant</p>

</div>

<div
class="messages"
id="messages">

<div class="message bot">

👋 Hello!

I'm <b>Bearly AI</b> 🧸

How can I help you today?

</div>
</div>

<div class="footer">

<input
type="text"
id="text"
placeholder="Type your message..."
autocomplete="off">

<button id="sendBtn">
Send
</button>

</div>

</div>

<script>

const messages = document.getElementById("messages");
const input = document.getElementById("text");
const button = document.getElementById("sendBtn");

let history = [];

function addMessage(text, type){

    const div = document.createElement("div");

    div.className = "message " + type;

    div.innerHTML = text;

    messages.appendChild(div);

    messages.scrollTop = messages.scrollHeight;

}

async function sendMessage(){

    const text = input.value.trim();

    if(!text) return;

    addMessage(text,"user");

    history.push({
        role:"user",
        content:text
    });

    input.value="";

    const loading = document.createElement("div");

    loading.className="message bot typing";

    loading.innerHTML="🧸 Bearly is typing...";

    messages.appendChild(loading);

    messages.scrollTop = messages.scrollHeight;

    try{

        const response = await fetch("/api/chat",{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({

                message:text,

                history:history.slice(-4)

            })

        });

        const data = await response.json();

        loading.className="message bot";

        loading.innerHTML = data.reply || "Sorry, I couldn't generate a response.";

        history.push({

            role:"assistant",

            content:loading.innerHTML

        });

        if(history.length>4){

            history = history.slice(-4);

        }

    }

    catch(error){

        loading.className="message bot";

        loading.innerHTML="❌ Failed to connect.";

        console.error(error);

    }

}

button.addEventListener("click",sendMessage);

input.addEventListener("keypress",function(e){

    if(e.key==="Enter"){

        sendMessage();

    }

});

</script>

</body>
</html>
